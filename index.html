<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mughal View Restaurant — Achabal</title>
<style>
  :root {
    --green: #0b3d2e; --gold: #d4af37; --cream: #fdf8f0;
    --brown: #3e2723; --text: #333;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: var(--cream); color: var(--text); line-height:1.6; }
  
  /* Hero */
  .hero {
    height: 85vh; min-height: 480px;
    background: linear-gradient(rgba(11,61,46,0.7), rgba(11,61,46,0.85)),
      url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80') center/cover;
    color: white; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding: 20px; position: relative;
  }
  .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-family: Georgia, serif; color: var(--gold); letter-spacing:1px; }
  .hero p { font-size: clamp(1rem, 3vw, 1.3rem); margin: 15px 0 25px; font-style: italic; opacity:0.9; }
  .hero .tag { background: var(--gold); color: var(--green); padding: 6px 18px; border-radius: 30px; font-weight:bold; font-size:0.85rem; letter-spacing:1px; }
  .hero-info { position:absolute; bottom: 20px; font-size:0.9rem; opacity:0.85; }
  
  /* Container */
  .container { max-width: 1100px; margin: auto; padding: 50px 20px; }
  .section-title { text-align:center; font-family: Georgia, serif; font-size: 2rem; color: var(--green); margin-bottom: 10px; }
  .divider { width: 80px; height: 3px; background: var(--gold); margin: 0 auto 35px; border-radius:2px; }
  
  /* Menu Categories */
  .tabs { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-bottom:30px; }
  .tab { padding: 8px 20px; border-radius:30px; border: 2px solid var(--green); background:transparent; color:var(--green); font-weight:600; cursor:pointer; transition:0.3s; }
  .tab.active, .tab:hover { background: var(--green); color: var(--gold); }
  
  /* Menu Grid */
  .menu-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px; }
  .menu-item {
    background: white; border-radius:12px; padding:20px; display:flex; justify-content:space-between; align-items:center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 4px solid var(--gold); transition:0.3s;
  }
  .menu-item:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
  .item-info h3 { color: var(--green); font-size:1.1rem; margin-bottom:4px; }
  .item-info p { font-size:0.85rem; color:#666; }
  .item-price { font-weight:bold; color: var(--brown); font-size:1.2rem; margin-right:15px; }
  .add-btn {
    background: var(--green); color: var(--gold); border:none; width:35px; height:35px; border-radius:50%;
    font-size:1.3rem; cursor:pointer; transition:0.2s;
  }
  .add-btn:active { transform: scale(0.9); }
  
  /* Cart Bar */
  .cart-bar {
    position: fixed; bottom: 0; left:0; width:100%; background: var(--green); color: white;
    padding: 15px 20px; display:flex; justify-content:space-between; align-items:center;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.2); z-index: 100; transform: translateY(100%); transition:0.3s;
  }
  .cart-bar.show { transform: translateY(0); }
  .cart-bar .total { font-weight:bold; font-size:1.1rem; }
  .cart-bar .total span { color: var(--gold); }
  .whatsapp-btn {
    background: #25D366; color: white; border:none; padding: 10px 20px; border-radius:30px;
    font-weight:bold; font-size:0.95rem; cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  
  /* Info Sections */
  .info-section { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 50px 20px; background: var(--green); color: white; }
  .info-card { background: rgba(255,255,255,0.05); padding: 25px; border-radius:12px; border: 1px solid rgba(212,175,55,0.3); }
  .info-card h3 { color: var(--gold); font-family: Georgia, serif; margin-bottom: 10px; font-size:1.3rem; }
  .info-card p { opacity: 0.9; font-size:0.95rem; }
  
  footer { text-align:center; padding: 20px; background: var(--brown); color: #aaa; font-size:0.8rem; }
  
  /* Toast */
  .toast {
    position: fixed; top: 20px; left:50%; transform: translateX(-50%) translateY(-100px);
    background: var(--gold); color: var(--green); padding: 10px 25px; border-radius:30px; font-weight:bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition:0.3s; z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <span class="tag">SINCE ACHABAL ❖ KASHMIR</span>
  <h1>Mughal View</h1>
  <p>Authentic Kashmiri Flavours &amp; Warm Hospitality</p>
  <div class="hero-info">📍 Achabal, Kashmir &nbsp; | &nbsp; 🕘 9:00 AM – 9:00 PM Daily</div>
</section>

<!-- MENU -->
<div class="container" id="menu">
  <h2 class="section-title">Our Menu</h2>
  <div class="divider"></div>

  <div class="tabs">
    <button class="tab active" onclick="filterMenu('all')">All</button>
    <button class="tab" onclick="filterMenu('starters')">Starters</button>
    <button class="tab" onclick="filterMenu('mains')">Main Course</button>
    <button class="tab" onclick="filterMenu('breads')">Breads</button>
    <button class="tab" onclick="filterMenu('drinks')">Beverages</button>
  </div>

  <div class="menu-grid" id="menuGrid">
    <!-- JS will inject items -->
  </div>
</div>

<!-- CART BAR -->
<div class="cart-bar" id="cartBar">
